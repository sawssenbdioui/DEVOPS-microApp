apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      imagePullSecrets:
        - name: docker-cred
      containers:
        - name: client
          image: saharletaief23/proservice:client-service
          ports:
            - containerPort: 3000
