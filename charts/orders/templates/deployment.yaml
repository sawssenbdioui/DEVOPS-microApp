apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orders-chart.fullname" . }}
  labels:
    app: {{ include "orders-chart.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "orders-chart.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "orders-chart.name" . }}
    spec:
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
        {{- end }}
      containers:
        - name: orders
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: MONGO_URI
              value: {{ .Values.env.MONGO_URI | quote }}
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | quote }}
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.JWT_SECRET_NAME }}
                  key: {{ .Values.env.JWT_KEY }}
            - name: RABBITMQ_URL
              value: {{ .Values.env.RABBITMQ_URL | quote }}
