apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: expiration-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/sawssenbdioui/DEVOPS-microApp.git'
    targetRevision: devops
    path: charts/expiration
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

